services:
  # ─── WAF / ModSecurity ─────────────────────────────────────────
  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: ft_waf
    ports:
      - "${NGINX_HTTP_PORT}:8080"
      - "${NGINX_HTTPS_PORT}:8443"
    environment:
      BACKEND: http://nginx:80
      BACKEND_SSL: http://nginx:443
      PORT: 8080
      SSL_PORT: 8443
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 5
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - waf_certs:/etc/nginx/certs
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Reverse Proxy (nginx) ────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ft_nginx
    # No external port - all traffic goes through WAF
    expose:
      - "80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    ports:
      - "3010:3000"
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Backend (NestJS) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${BACKEND_PORT:-3001}/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: ft_postgres
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── HashiCorp Vault ─────────────────────────────────────────
  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    container_name: ft_vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Prometheus ──────────────────────────────────────────────
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    container_name: ft_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=http://localhost:8080/prometheus/"
      - "--web.route-prefix=/"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────────
  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: ft_grafana
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env



  # ─── Nginx Prometheus Exporter ───────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    container_name: ft_nginx_exporter
    command:
      - "--nginx.scrape-uri=http://nginx:80/metrics"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # ─── PostgreSQL Exporter ─────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ft_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-transcendence}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


# ─── Named Volumes ──────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  waf_certs:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ─── Networks ────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
