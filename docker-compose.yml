services:
  # ─── WAF / ModSecurity ─────────────────────────────────────────
  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: ft_waf
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
    environment:
      BACKEND: http://nginx:80
      BACKEND_SSL: http://nginx:443
      PORT: 8080
      SSL_PORT: 8443
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 5
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - waf_certs:/etc/nginx/certs
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Reverse Proxy (nginx) ────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ft_nginx
    # No external port - all traffic goes through WAF
    expose:
      - "80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    ports:
      - "3010:3000"
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Backend (NestJS) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:${BACKEND_PORT:-3001}/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: ft_postgres
    # No external port exposure for security - only internal access
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── HashiCorp Vault ─────────────────────────────────────────
  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    container_name: ft_vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── Prometheus ──────────────────────────────────────────────
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    container_name: ft_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=/prometheus/"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────────
  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: ft_grafana
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped
    env_file: .env

  # ─── cAdvisor (Container Metrics) ────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ft_cadvisor
    # privileged: true
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--housekeeping_interval=10s"
    volumes:
      # - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - /var/run:/var/run:ro
      # - /sys:/sys:ro
      # - /var/lib/docker/:/var/lib/docker:ro
      # - /dev/disk/:/dev/disk:ro
    networks:
      - app-network
    restart: unless-stopped

  # ─── Nginx Prometheus Exporter ───────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    container_name: ft_nginx_exporter
    command:
      - "--nginx.scrape-uri=http://nginx:80/metrics"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # ─── PostgreSQL Exporter ─────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ft_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence_password}@postgres:5432/${POSTGRES_DB:-transcendence}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ─── ELK Stack (Log Management) ──────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: ft_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.18
    container_name: ft_logstash
    user: root
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./monitoring/elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - /var/lib/docker:/var/lib/docker:ro
    depends_on:
      - elasticsearch
    networks:
      - app-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.18
    container_name: ft_kibana
    environment:
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - app-network
    restart: unless-stopped

  # ─── ELK Index Lifecycle Setup ───────────────────────────────
  elk-setup:
    image: alpine/curl:latest
    container_name: ft_elk_setup
    volumes:
      - ./monitoring/elk/setup-ilm.sh:/setup-ilm.sh:ro
    command: /bin/sh /setup-ilm.sh
    depends_on:
      - elasticsearch
    networks:
      - app-network

# ─── Named Volumes ──────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  waf_certs:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# ─── Networks ────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
