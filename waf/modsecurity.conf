# ─── ModSecurity Override Configuration ────────────────────────
# Strict WAF settings for ft_transcendence

# Enable ModSecurity engine
SecRuleEngine On

# Set audit log format and path
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogType Serial

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 20971520
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body handling
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# Temp file locations
SecTmpDir /tmp/
SecDataDir /tmp/

# ─── Strict rules ─────────────────────────────────────────────

# Block requests with missing Host header
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:60001,phase:1,deny,status:400,log,msg:'Missing Host header'"

# Block requests with invalid Content-Type on POST
SecRule REQUEST_METHOD "^POST$" \
    "chain,id:60002,phase:1,deny,status:415,log,msg:'Invalid Content-Type for POST'"
    SecRule &REQUEST_HEADERS:Content-Type "@eq 0" ""

# Enforce maximum URL length
SecRule REQUEST_URI "@gt 2048" \
    "id:60003,phase:1,deny,status:414,log,msg:'URI too long'"

# Block common scanners and bots
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/modsecurity.d/scanners-user-agents.txt" \
    "id:60004,phase:1,deny,status:403,log,msg:'Known scanner/bot blocked'"

# Block access to sensitive files
SecRule REQUEST_URI "@rx \.(env|git|sql|bak|swp|log)$" \
    "id:60005,phase:1,deny,status:403,log,msg:'Access to sensitive file blocked'"

# Rate limit by IP (complements nginx rate limiting)
SecAction "id:60006,phase:1,nolog,pass,initcol:IP=%{REMOTE_ADDR},setvar:IP.counter=+1,expirevar:IP.counter=60"
SecRule IP:counter "@gt 120" \
    "id:60007,phase:1,deny,status:429,log,msg:'Rate limit exceeded'"
