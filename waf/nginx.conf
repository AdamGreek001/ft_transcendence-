# ─── WAF nginx configuration ─────────────────────────────────
# Development configuration: HTTP only with ModSecurity WAF filtering
# This nginx instance sits in front of the internal nginx reverse proxy

upstream internal_nginx {
    server nginx:80;
}

server {
    listen 80;
    server_name _;
    
    client_max_body_size 20M;

    # ModSecurity is enabled globally via the CRS base image

    # Handle CORS preflight requests
    location / {
        proxy_pass http://internal_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
