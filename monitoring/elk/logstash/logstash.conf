input {
  file {
    # Read the raw JSON log files generated by Docker for every container
    path => "/var/lib/docker/containers/*/*.log"
    codec => "json"
    type => "docker"
    start_position => "beginning"
  }
}

filter {
  if [type] == "docker" {
    # Parse the timestamp from the Docker log format
    date {
      match => [ "time", "ISO8601" ]
    }
    # Standardize the log field name to "message" for Kibana
    mutate {
      rename => { "log" => "message" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
    # We will manage ILM (Index Lifecycle Management) manually via Elasticsearch API
    ilm_enabled => false
  }
}
